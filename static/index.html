<!DOCTYPE html>
<html lang="sr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Košnica 3D</title>
<style>
/* VAJB base.css 1.0 - PRAVILA.md UI1, UI4, UI8, UI12. Load before the app's own CSS. */

:root, [data-theme="dark"] {
  --bg: #121316; --surface: #1a1c20; --border: #2a2d33; --text: #e8e9eb; --muted: #9a9ea6;
  --accent: #d9a441; --accent-text: #121316; --danger: #e5484d; --overlay: rgba(0, 0, 0, .55);
  --radius: 10px; --gap: 12px; --font: system-ui, "Segoe UI", sans-serif;
}
[data-theme="light"] {
  --bg: #f6f6f4; --surface: #ffffff; --border: #dcdcd8; --text: #1b1c1e; --muted: #6b6e74;
  --accent: #b7801f; --accent-text: #ffffff; --danger: #c62f34; --overlay: rgba(0, 0, 0, .35);
}

/* UI1: scrollbar space always reserved - content never shifts */
html { overflow-y: scroll; scrollbar-gutter: stable; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--font); }

/* UI8: no grey Windows controls */
* { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; border: 2px solid var(--bg); }
::-webkit-scrollbar-track { background: transparent; }
input[type="checkbox"], input[type="radio"] { accent-color: var(--accent); width: 16px; height: 16px; }
input, select, textarea, button { font: inherit; color: inherit; }
input:not([type="checkbox"]):not([type="radio"]), select, textarea {
  background: var(--surface); border: 1px solid var(--border); border-radius: calc(var(--radius) - 4px);
  padding: 7px 10px; outline: none;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
button { cursor: pointer; border-radius: calc(var(--radius) - 4px); padding: 7px 14px;
  border: 1px solid var(--border); background: var(--surface); }
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
button.danger { background: var(--danger); color: #fff; border-color: var(--danger); }
.icon { width: 18px; height: 18px; stroke: currentColor; fill: none; vertical-align: middle; }

/* UI4: app dialog (dialog.js) */
.vd-overlay { position: fixed; inset: 0; background: var(--overlay); display: grid; place-items: center; z-index: 1000; }
.vd-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  width: min(420px, calc(100vw - 32px)); padding: 22px; text-align: center; box-sizing: border-box; }
.vd-text { margin: 0 0 18px; white-space: pre-line; }
.vd-input { width: 100%; box-sizing: border-box; margin-bottom: 18px; }
.vd-buttons { display: grid; grid-auto-columns: 1fr; grid-auto-flow: column; gap: var(--gap); }
body.vd-lock { overflow: hidden; }

html, body { height: 100%; }
body { display: grid; grid-template-rows: 56px 1fr 34px; overflow: hidden; }
body > footer.sig-f { display: flex; justify-content: center; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); background: var(--surface); }
body > footer.sig-f svg { width: 15px; height: 15px; color: var(--accent); stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
svg.i { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 16px;
  border-bottom: 1px solid var(--border); background: var(--surface); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; letter-spacing: .3px; }
.brand svg { width: 26px; height: 26px; color: var(--accent); stroke-width: 2; }
.tabs { display: flex; gap: 4px; background: var(--bg); padding: 4px; border-radius: 10px; border: 1px solid var(--border); }
.tabs button { border: 0; background: transparent; display: flex; align-items: center; gap: 8px; padding: 6px 14px; color: var(--muted); }
.tabs button.on { background: var(--surface); color: var(--text); box-shadow: 0 0 0 1px var(--border); }
.tabs button:disabled { opacity: .45; cursor: default; }
.right { display: flex; justify-content: flex-end; align-items: center; gap: 8px; }
.iconbtn { width: 36px; height: 36px; padding: 0; display: grid; place-items: center; }

main { display: grid; grid-template-columns: 300px 1fr; min-height: 0; }
aside { border-right: 1px solid var(--border); background: var(--surface); padding: 16px; display: flex; flex-direction: column;
  gap: 18px; overflow-y: auto; min-height: 0; }
.sec { display: flex; flex-direction: column; gap: 8px; }
.lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); display: flex; justify-content: space-between; }
.lbl b { color: var(--text); font-weight: 600; text-transform: none; letter-spacing: 0; font-size: 12px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--bg); padding: 3px; border-radius: 8px; border: 1px solid var(--border); }
.seg button { border: 0; background: transparent; padding: 6px 4px; color: var(--muted); font-size: 13px; }
.seg button.on { background: var(--accent); color: var(--accent-text); }
.chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.chips button { padding: 8px 4px; font-size: 13px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.chips button.on { border-color: var(--accent); color: var(--accent); }
.chips svg.sh { width: 26px; height: 26px; fill: currentColor; stroke: none; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.num { display: flex; align-items: center; gap: 6px; }
.num input { width: 100%; min-width: 0; text-align: center; }
.num span { color: var(--muted); font-size: 12px; }
.sw { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.sw button { aspect-ratio: 1; padding: 0; border-radius: 50%; border: 2px solid transparent; box-shadow: inset 0 0 0 2px var(--surface); }
.sw button.on { border-color: var(--accent); }
input[type=range] { padding: 0; border: 0; box-sizing: border-box; -webkit-appearance: none; appearance: none; width: 100%; height: 4px; border-radius: 4px; background: var(--border); outline: none; margin: 8px 0; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--accent); cursor: pointer; }
input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); border: 3px solid var(--surface); cursor: pointer; }
#netbox { display: none; position: absolute; right: 16px; bottom: 16px; width: 168px; padding: 8px; gap: 6px; flex-direction: column; z-index: 2;
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px; pointer-events: none; }
#netbox.on { display: flex; }
#presek { display: none; position: absolute; right: 16px; bottom: 16px; width: 200px; padding: 8px; gap: 6px; flex-direction: column; z-index: 2;
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px; pointer-events: none; }
#presek.on { display: flex; }
#planbox { display: none; position: absolute; right: 16px; bottom: 16px; width: 220px; padding: 10px; gap: 8px; flex-direction: column; z-index: 2;
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px; pointer-events: none; font-size: 12px; }
#planbox.on { display: flex; }
#planbox .pr { display: grid; grid-template-columns: 16px 1fr auto; gap: 8px; align-items: center; }
#planbox .pc2 { color: var(--muted); text-align: center; font-size: 11px; }
.sw1 { width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--border); display: inline-block; }
.lrows { display: flex; flex-direction: column; gap: 6px; }
.lrow { display: grid; grid-template-columns: 16px 1fr 58px 28px 28px; gap: 6px; align-items: center; font-size: 12px; }
.lrow input { width: 100%; padding: 4px 6px; text-align: center; }
.lrow .iconbtn { width: 28px; height: 28px; }
.lrow .iconbtn svg { width: 14px; height: 14px; }
.lprev { width: 100%; height: 120px; object-fit: contain; display: block; border-radius: 8px; border: 1px solid var(--border);
  background: repeating-conic-gradient(var(--bg) 0 25%, var(--surface) 0 50%) 0 0 / 14px 14px; }
.lname { text-align: center; color: var(--muted); font-size: 12px; }
#presek svg { width: 100%; height: auto; display: block; }
#net { width: 100%; aspect-ratio: 1; background: var(--bg); border-radius: 6px; display: block; }
.grow { flex: 1; }
button.wide { width: 100%; display: flex; justify-content: center; align-items: center; gap: 8px; padding: 10px; font-weight: 600; }

#stage { display: grid; grid-template-rows: 1fr 52px; min-height: 0; min-width: 0; }
#views { display: grid; grid-template-columns: 1fr; min-height: 0; }
#views.split { grid-template-columns: 1fr 1fr; }
#plan { display: none; min-height: 0; min-width: 0; padding: 16px; border-right: 1px solid var(--border); }
#views.split #plan { display: grid; place-items: center; }
#plan svg { width: 100%; height: 100%; }
#plan polygon { cursor: pointer; }
#v3d { position: relative; min-height: 0; min-width: 0; touch-action: none; cursor: grab; }
#v3d > canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#bar { border-top: 1px solid var(--border); background: var(--surface); display: grid; grid-template-columns: 1fr auto; align-items: center; padding: 0 16px; gap: 16px; }
#stats { display: flex; gap: 8px; align-items: center; overflow: hidden; white-space: nowrap; }
.st { background: var(--bg); border: 1px solid var(--border); border-radius: 20px; padding: 4px 12px; font-size: 13px; }
.st i { font-style: normal; color: var(--muted); margin-right: 6px; }
.st.bad { border-color: var(--danger); color: var(--danger); }
#sim { display: none; align-items: center; gap: 10px; width: 340px; }
#sim.on { display: flex; }
#sim .lbl { min-width: 92px; }

.vv-row { display: flex; align-items: center; justify-content: space-between; gap: var(--gap); min-height: 36px; }
.vv-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.vv-st { font-size: 12px; display: flex; align-items: center; gap: 4px; }
.vv-ok { color: #4caf50; } .vv-muted { color: var(--muted); } .vv-new { color: var(--accent); }
.vv-bar { display: flex; align-items: center; justify-content: center; gap: var(--gap); padding: 6px 12px;
  background: var(--surface); border-bottom: 1px solid var(--border); }
.vv-toast { position: fixed; left: 50%; bottom: 64px; transform: translateX(-50%); background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 16px; box-shadow: 0 10px 30px rgba(0,0,0,.4); z-index: 950; }
#vvBars { position: fixed; top: 56px; left: 0; right: 0; z-index: 50; }
/* Podešavanja (UI12) */
.set-ov { position: fixed; inset: 0; background: var(--overlay); display: grid; place-items: center; z-index: 900; }
.set-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; width: min(760px, calc(100vw - 32px));
  height: min(620px, calc(100vh - 32px)); display: grid; grid-template-rows: 56px 1fr; overflow: hidden; }
.set-head { display: grid; grid-template-columns: 36px 1fr 36px; align-items: center; padding: 0 12px; border-bottom: 1px solid var(--border); }
.set-head h2 { margin: 0; font-size: 16px; text-align: center; }
.set-body { display: grid; grid-template-columns: 180px 1fr; min-height: 0; }
.set-nav { border-right: 1px solid var(--border); padding: 12px; display: flex; flex-direction: column; gap: 4px; }
.set-nav button { border: 0; background: transparent; text-align: left; color: var(--muted); }
.set-nav button.on { background: var(--bg); color: var(--text); }
.set-pane { padding: 16px; display: flex; flex-direction: column; gap: 16px; min-height: 0; overflow: hidden; }
.set-row { display: grid; grid-template-columns: 1fr 220px; align-items: center; gap: 12px; }
.logbox { flex: 1; min-height: 0; overflow-y: auto; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 12px; font: 12px/1.55 ui-monospace, Consolas, monospace; white-space: pre-wrap; word-break: break-word; }
.logbox .e { color: var(--danger); }
.logbox .w { color: var(--accent); }
.days { display: flex; gap: 6px; flex-wrap: wrap; }
.days button { padding: 4px 10px; font-size: 12px; }
.days button.on { border-color: var(--accent); color: var(--accent); }
.muted { color: var(--muted); font-size: 13px; }

.plist { display: flex; flex-direction: column; gap: 6px; }
.pt { display: grid; grid-template-columns: 1fr 36px; gap: 6px; }
.pt-main { display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: 10px; text-align: left; padding: 6px 10px; min-width: 0; }
.pt.on .pt-main { border-color: var(--accent); }
.pt-main b { width: 28px; height: 28px; border-radius: 6px; background: var(--accent); color: var(--accent-text); display: grid; place-items: center; }
.pt-main span { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); min-width: 0; }
.pt-main span strong { color: var(--text); font-weight: 600; font-size: 13px; }
.pt-main em { font-style: normal; font-weight: 600; }
.pt .dl { height: auto; width: 36px; }
details.adv { border: 1px solid var(--border); border-radius: 10px; background: var(--bg); }
details.adv summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; font-weight: 600; }
details.adv summary::-webkit-details-marker { display: none; }
details.adv[open] summary svg { transform: rotate(180deg); }
details.adv .advin { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 14px; }
details.adv .seg { background: var(--surface); }
svg.sh-i { width: 26px; height: 26px; }
.chips + .sec { margin-top: 10px; }
.ptypes { display: flex; flex-direction: column; gap: 6px; }
.ptypes button { display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: 10px; text-align: left; padding: 6px 10px; }
.ptypes button.on { border-color: var(--accent); }
.ptypes b { width: 28px; height: 28px; border-radius: 6px; background: var(--accent); color: var(--accent-text); display: grid; place-items: center; }
.ptypes span { font-size: 12px; color: var(--muted); }
.ptypes em { font-style: normal; font-weight: 600; }
.chips.els { grid-template-columns: repeat(3, 1fr); }
.chips.els button { font-size: 12px; min-height: 44px; line-height: 1.2; justify-content: center; }
.chips.edges { grid-template-columns: repeat(4, 1fr); }
#printcard .pc { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.pc td, .pc th { padding: 5px 8px; white-space: nowrap; border-bottom: 1px solid var(--border); }
.pc tr:last-child td { border-bottom: 0; }
.pc td:first-child { color: var(--muted); }
.pc td:not(:first-child), .pc th { text-align: right; }
.pc th { font-weight: 600; font-size: 12px; }
.sec .seg + .sw { margin-top: 4px; }

@media (max-width: 820px) {
  body { grid-template-rows: auto 1fr auto; overflow: auto; height: auto; }
  body > footer.sig-f { padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); }
  header { grid-template-columns: 1fr auto; row-gap: 8px; padding: 8px 12px; }
  header .tabs { grid-column: 1 / -1; grid-row: 2; justify-self: center; }
  main { grid-template-columns: 1fr; }
  aside { border-right: 0; border-bottom: 1px solid var(--border); }
  #stage { height: 80vh; }
  #views.split { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
  #sim { width: 200px; }
}
</style>
</head>

<header>
  <div class="brand"><svg class="i"><use href="#t-hexagons"/></svg>Košnica 3D</div>
  <nav class="tabs">
    <button data-mode="hsw" class="on"><svg class="i"><use href="#t-hexagon"/></svg>HSW</button>
    <button data-mode="orn"><svg class="i"><use href="#t-christmas-ball"/></svg>Ornament</button>
    <button data-mode="box"><svg class="i"><use href="#t-box"/></svg>Kutija</button>
    <button data-mode="logo"><svg class="i"><use href="#t-badge"/></svg>Logo</button>
    <button data-mode="ram"><svg class="i"><use href="#t-frame"/></svg>Ramovi</button>
    <button disabled><svg class="i"><use href="#t-plus"/></svg>Projekat</button>
  </nav>
  <div class="right">
    <div class="seg" id="printer"><button data-v="k1" class="on">K1 Max</button><button data-v="k2">K2 Plus</button></div>
    <button class="iconbtn" id="settings"><svg class="i"><use href="#t-settings"/></svg></button>
    <button class="iconbtn" id="power" hidden><svg class="i"><use href="#t-power"/></svg></button>
  </div>
</header>
<div id="vvBars"></div>

<main>
  <aside id="side"></aside>
  <input type="file" id="svgIn" accept=".svg,image/svg+xml" hidden>
  <input type="file" id="logoFile" accept="image/png,image/jpeg,image/webp,image/svg+xml,.svg" hidden>

<script>
// VAJB version.js 1.1 - "Verzija" u Podešavanjima + traka „Nova verzija“ (PRAVILA.md V1, V2, V3). Based on PDFactory.
// Needs base.css + dialog.js. Server: GET /api/update (update.status / selfupdate.check), POST /api/update
// (update.apply / selfupdate.apply), GET /health -> {pid, version}, GET /api/settings -> {version: "<App> X.Y.Z · hash"}.
//
//   vv.init({ storeKey: "mojaapp", beforeUpdate: async () => true, labels: {...} });   // once at start
//   vv.section(container, settings.version)   // row: "<App> X.Y.Z · hash" + under it the state of the last check
//                                             // („Najnovija verzija · provereno 14:40“ / „Nova verzija X“) + one button
//   vv.startChecks(barsElement)               // check at start and every hour -> bar „Nova verzija X“ + Ažuriraj
//
// Every check (start, hourly, by hand) is remembered and shown in the section. Button: „Proveri“, or „Ažuriraj na X“
// when a newer version is known; one click checks and, if newer (or code on disk newer than the running server),
// updates + restarts at once. After the reload a toast says „Ažurirano: X.Y.Z“.
// beforeUpdate: save the workspace / ask about unsaved changes; return false to cancel.
(function () {
  const L = {
    check: "Proveri", updateTo: (v) => `Ažuriraj na ${v}`, latest: "Najnovija verzija", failed: "Provera nije uspela",
    checking: "Provera…", checked: (t) => `provereno ${t}`,
    updating: (v) => `Ažuriranje na ${v}…`, newVersion: (v) => `Nova verzija ${v}`, update: "Ažuriraj",
    updated: (v) => `Ažurirano: ${v}`, theNew: "novu verziju",
  };
  let opt = { storeKey: "app", beforeUpdate: async () => true };
  let pid = null;
  let last = null;                        // {r, at} of the last check
  const isNew = (r) => r && r.ok && (r.behind || r.restart);
  const hhmm = (d) => d.toLocaleTimeString("sr-RS", { hour: "2-digit", minute: "2-digit" });
  async function check() {
    const r = await getJSON("/api/update").catch(() => ({ ok: false }));
    last = { r, at: new Date() };
    return r;
  }
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const getJSON = (u) => fetch(u).then((r) => r.json());

  function toast(text) {
    const t = document.createElement("div"); t.className = "vv-toast"; t.textContent = text;
    document.body.appendChild(t); setTimeout(() => t.remove(), 4000);
  }

  async function init(o = {}) {
    opt = { ...opt, ...o }; Object.assign(L, o.labels || {});
    try { pid = (await getJSON("/health")).pid; } catch (e) { /* server not up yet */ }
    const key = opt.storeKey + ".upd";
    try {
      if (localStorage.getItem(key) !== null) {
        localStorage.removeItem(key);
        const h = await getJSON("/health"); toast(L.updated(h.version));
      }
    } catch (e) { /* no storage */ }
  }

  async function waitRestart() {
    for (let i = 0; i < 90; i++) {
      await new Promise((r) => setTimeout(r, 1000));
      try { const h = await getJSON("/health"); if (h.pid !== pid) { location.reload(); return; } } catch (e) { /* restarting */ }
    }
  }

  async function doUpdate(r) {
    if (!(await opt.beforeUpdate())) return false;
    try { localStorage.setItem(opt.storeKey + ".upd", r.version || ""); } catch (e) { /* no storage */ }
    const p = await fetch("/api/update", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" })
      .then((x) => x.json()).catch(() => null);
    if (p && p.ok) { setTimeout(waitRestart, 1500); return true; }
    try { localStorage.removeItem(opt.storeKey + ".upd"); } catch (e) { /* no storage */ }
    if (p && p.error && window.vd) vd.message(p.error);
    return false;
  }

  function section(container, label) {
    const row = document.createElement("div"); row.className = "vv-row";
    row.innerHTML = `<div class="vv-info"><span>${esc(label)}</span><span class="vv-st"></span></div><button type="button"></button>`;
    const st = row.querySelector(".vv-st"), b = row.querySelector("button");
    const paint = () => {
      if (!last) { st.innerHTML = `<span class="vv-muted">${esc(L.checking)}</span>`; b.textContent = L.check; return; }
      const r = last.r, n = isNew(r);
      st.innerHTML = !r.ok ? `<span class="vv-muted">${esc(L.failed)} · ${hhmm(last.at)}</span>`
        : n ? `<span class="vv-new">${esc(L.newVersion(r.version || ""))}</span>`
        : `<span class="vv-ok">${esc(L.latest)}</span><span class="vv-muted">· ${esc(L.checked(hhmm(last.at)))}</span>`;
      b.textContent = n ? L.updateTo(r.version || "") : L.check;
      b.classList.toggle("primary", !!n);
    };
    b.onclick = async () => {
      let r = last && last.r;
      if (!isNew(r)) { st.innerHTML = `<span class="vv-muted">${esc(L.checking)}</span>`; r = await check(); paint(); }
      if (isNew(r)) {
        b.disabled = true; st.innerHTML = `<span class="vv-ok">${esc(L.updating(r.version || L.theNew))}</span>`;
        if (!(await doUpdate(r))) { b.disabled = false; paint(); }
      }
    };
    container.appendChild(row);
    paint();
    if (!last || Date.now() - last.at > 3600 * 1000) check().then(() => row.isConnected && paint());
    return row;
  }

  function startChecks(bars) {
    const run = async () => {
      const r = await check();
      if (!isNew(r) || document.getElementById("vv-bar")) return;
      const el = document.createElement("div"); el.id = "vv-bar"; el.className = "vv-bar";
      el.innerHTML = `<span>${esc(L.newVersion(r.version || ""))}</span><button type="button" class="primary">${esc(L.update)}</button>`;
      el.querySelector("button").onclick = async () => {
        el.querySelector("span").textContent = L.updating(r.version || L.theNew);
        el.querySelector("button").remove();
        if (!(await doUpdate(r))) el.remove();
      };
      bars.appendChild(el);
    };
    run(); setInterval(run, 3600 * 1000);
  }

  window.vv = { init, section, startChecks, update: doUpdate };
})();

</script>
<script>
// VAJB dialog.js 1.0 - replaces alert/confirm/prompt with the app's own dialog (PRAVILA.md UI4, UI5).
// Needs base.css. Usage:
//   if (await vd.confirm("Obrisati projekat?", {ok: "Obriši", danger: true})) ...
//   await vd.message("Sačuvano.")
//   const name = await vd.prompt("Naziv", {value: "Novi"})   // null = cancelled
// Esc and click outside = cancel. Focus is trapped and returned. Each call builds its own dialog (UI5).
(function () {
  function open({ text, buttons, input }) {
    return new Promise((resolve) => {
      const prevFocus = document.activeElement;
      const ov = document.createElement("div");
      ov.className = "vd-overlay";
      ov.innerHTML = '<div class="vd-card" role="dialog" aria-modal="true"><p class="vd-text"></p><div class="vd-buttons"></div></div>';
      const card = ov.firstChild;
      card.querySelector(".vd-text").textContent = text;
      let field = null;
      if (input) {
        field = document.createElement("input");
        field.className = "vd-input";
        field.value = input.value || "";
        card.insertBefore(field, card.querySelector(".vd-buttons"));
      }
      const close = (val) => {
        document.removeEventListener("keydown", onKey, true);
        ov.remove();
        document.body.classList.remove("vd-lock");
        if (prevFocus && prevFocus.focus) prevFocus.focus();
        resolve(val);
      };
      const btns = buttons.map((b) => {
        const el = document.createElement("button");
        el.textContent = b.label;
        if (b.cls) el.className = b.cls;
        el.onclick = () => close(b.cancel ? (input ? null : false) : (input ? field.value : b.value));
        card.querySelector(".vd-buttons").appendChild(el);
        return el;
      });
      const cancel = buttons.find((b) => b.cancel);
      const onKey = (e) => {
        if (e.key === "Escape") { e.preventDefault(); close(cancel ? (input ? null : false) : true); }
        if (e.key === "Enter" && field && document.activeElement === field) { e.preventDefault(); close(field.value); }
        if (e.key === "Tab") {
          const f = [field, ...btns].filter(Boolean);
          const i = f.indexOf(document.activeElement);
          e.preventDefault();
          f[(i + (e.shiftKey ? f.length - 1 : 1)) % f.length].focus();
        }
      };
      ov.addEventListener("mousedown", (e) => { if (e.target === ov) close(cancel ? (input ? null : false) : true); });
      document.addEventListener("keydown", onKey, true);
      document.body.classList.add("vd-lock");
      document.body.appendChild(ov);
      (field || btns[btns.length - 1]).focus();
    });
  }

  window.vd = {
    confirm: (text, o = {}) => open({ text, buttons: [
      { label: o.cancel || "Odustani", cancel: true },
      { label: o.ok || "Nastavi", value: true, cls: o.danger ? "danger" : "primary" }] }),
    message: (text, o = {}) => open({ text, buttons: [{ label: o.ok || "U redu", value: true, cls: "primary" }] }),
    prompt: (text, o = {}) => open({ text, input: { value: o.value }, buttons: [
      { label: o.cancel || "Odustani", cancel: true },
      { label: o.ok || "Sačuvaj", value: true, cls: "primary" }] }),
  };
})();

</script>

const RAM_FORMATI = { "9×13": [127, 89], "10×15": [152, 102], "13×18": [178, 127], "15×20": [203, 152], "18×24": [240, 180], "20×30": [300, 200], "A4": [297, 210], "ručno": null };

function drawRam(reframe) {
  clearRoot(); const d = RAM.data; if (!d || !d.delovi) return;
  const g = new THREE.Group(), box = new THREE.Box3(), cnt = { crni: 0, beli: 0 };
  const SH = { crni: [0x2b2b2b, 0x404040], beli: [0xf4f4f0, 0xdcdcd6] };
  for (const p of d.delovi) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(b64(p.v, Float32Array), 3));
    geo.setIndex(new THREE.BufferAttribute(b64(p.i, Uint32Array), 1)); geo.computeVertexNormals();
    const k = cnt[p.boja]++, m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: SH[p.boja][k % 2], roughness: .7, metalness: 0 }));
    if (S.ram.rastavi) m.position.z = [0, 14, 28, 46][ramVrsta(p.ime)];
    g.add(m); geo.computeBoundingBox(); box.union(geo.boundingBox.clone().translate(m.position));
  }
  const c = box.getCenter(new THREE.Vector3()); g.children.forEach((m) => m.position.sub(c));
  g.rotation.y = Math.PI; root.add(g);   // lice rama (z = 0) gleda ka kameri

}
function buildRam(reframe) {

let pending = null;

    if (k === "lid" || k === "grip" || k === "bview") { S.box[k === "bview" ? "view" : k] = v; if (k === "lid") { renderSide(); log("INFO", `poklopac: ${LIDS[v]}`); } return rebuild(false); }
    if (k === "border") { S.hsw.border = v === "da"; S.hsw.removed.projekat.clear(); S.hsw.sel = 0; log("INFO", `ravna ivica: ${v}`); return rebuild(true); }

$("#side").addEventListener("input", (e) => {
  const t = e.target;
  if (t.id === "rw" || t.id === "rh") {
    const v = parseFloat(t.value); if (!(v >= 40)) return;
    S.ram[t.id === "rw" ? "w" : "h"] = Math.min(v, 1500);
    clearTimeout(window._ornT); window._ornT = setTimeout(() => rebuild(true), 400); return;
  }
  if (t.id === "rnaziv") { S.ram.naziv = t.value.trim() || "hsw_ram"; return; }
  if (t.id === "zw" || t.id === "zh") {
    const v = parseInt(t.value, 10); if (!(v >= 10)) return;
    S.hsw[t.id === "zw" ? "w" : "h"] = Math.min(v, t.id === "zw" ? 500 : 300); S.hsw.removed.projekat.clear(); S.hsw.sel = 0;
    log("INFO", `zid: ${S.hsw.w} × ${S.hsw.h} cm`);
    return schedule(() => rebuild(true));
  }
  if (t.classList.contains("lt")) {
    const i = +t.dataset.i, v = parseFloat(t.value); if (!(v > 0)) return;
    if (i === 0) S.logo.base = v; else S.logo.t[i] = v;
    clearTimeout(window._ornT); window._ornT = setTimeout(() => rebuild(false), 250); return;
  }
  if (t.dataset.r) {
    const k = t.dataset.r, v = parseFloat(t.value), st = parseFloat(t.step);
    let unit = "mm";
    if (k.startsWith("d_")) { S.hsw.dims[S.hsw.el][k.slice(2)] = v; unit = dimUnit(S.hsw.el, k.slice(2)); }
    else if (k === "pcol" || k === "prow") { S.hsw[k] = v; S.hsw.removed.panel.clear(); unit = ""; }
    else if (k.startsWith("b_")) { S.box[k.slice(2)] = v; unit = BOX_DIMS.find((d) => d[0] === k.slice(2))[5]; if (k === "b_snap" || k === "b_gap") drawPresek(); }
    else if (k.startsWith("p_")) S.pat[k.slice(2)] = v;
    else if (k.startsWith("l_")) { S.logo[k.slice(2)] = v; if (k === "l_smooth") unit = ""; }
    else { S.orn[k] = v; if (k === "bulge") unit = "%"; }
    $("#v-" + k).textContent = `${fmtNum(v, st < 1 ? (st < .1 ? 2 : 1) : 0)}${unit ? " " + unit : ""}`;
    if (S.mode === "orn" || S.mode === "box" || S.mode === "logo" || k.startsWith("p_")) { clearTimeout(window._ornT); window._ornT = setTimeout(() => rebuild(false), 160); }
    else schedule(() => rebuild(k === "pcol" || k === "prow"));
  }

const fmtBytes = (b) => b < 1024 ? `${fmtNum(b)} B` : b < 1048576 ? `${fmtNum(b / 1024, 1)} KB` : `${fmtNum(b / 1048576, 1)} MB`;

const SET = { tab: "opste", day: null, filter: "sve", older: "30" };

  const close = () => { document.removeEventListener("keydown", onKey, true); ov.remove(); document.body.classList.remove("vd-lock"); };
  const onKey = (e) => { if (e.key === "Escape" && !document.querySelector(".vd-overlay")) { e.preventDefault(); close(); } };
  const pane = ov.querySelector(".set-pane");
  const draw = () => {
    ov.querySelectorAll("[data-tab]").forEach((b) => b.classList.toggle("on", b.dataset.tab === SET.tab));
    if (SET.tab === "opste") {
      pane.innerHTML = `<div class="set-row"><span>Tema</span>${seg("theme", { dark: "Tamna", light: "Svetla" }, document.documentElement.dataset.theme)}</div>
        <div class="set-row"><span>Štampač</span>${seg("printer", { k1: "K1 Max", k2: "K2 Plus" }, S.printer)}</div>
        <div class="set-row"><span>Verzija</span><div id="verBox"></div></div>`;
      if (LOCAL) vv.section(pane.querySelector("#verBox"), HEALTH.label || `Košnica 3D ${VERSION}`);
      else pane.querySelector("#verBox").innerHTML = `<span class="muted">Košnica 3D ${VERSION}</span>`;
    } else {
      const days = logDays(); if (!SET.day || !days.includes(SET.day)) SET.day = days[0];
      const raw = (SET.day && store.get(LOG_PREFIX + SET.day)) || "";
      const rows = [], lines = raw.split("\n").filter(Boolean); let keep = false;
      for (const l of lines) {
        const isHead = /^\d{4}-\d\d-\d\d /.test(l), lvl = isHead ? l.slice(20, 25).trim() : null;
        if (isHead) keep = SET.filter === "sve" || lvl === "ERROR" || lvl === "WARN";
        if (!keep) continue;
        const cls = isHead ? (lvl === "ERROR" ? "e" : lvl === "WARN" ? "w" : "") : "e";
        rows.push(`<div class="${cls}">${esc(l)}</div>`);
      }
      pane.innerHTML = `<div class="set-row"><span>Veličina dnevnika</span><span class="muted" style="text-align:right">${fmtBytes(logSize())} · ${fmtNum(days.length)} ${days.length === 1 ? "dan" : "dana"}</span></div>
        <div class="days">${days.map((d) => `<button data-day="${d}" class="${d === SET.day ? "on" : ""}">${fmtDay(d)}</button>`).join("")}</div>
        <div class="set-row"><span>Prikaz</span>${seg("filter", { sve: "Sve", greske: "Greške" }, SET.filter)}</div>
        <div class="logbox">${rows.join("") || '<span class="muted">Prazno</span>'}</div>
        <div class="set-row"><span>Obriši starije od</span><div style="display:grid;grid-template-columns:1fr auto;gap:8px">${seg("older", { "7": "7 d", "30": "30 d", "90": "90 d" }, SET.older)}<button class="danger" data-purge>Obriši</button></div></div>`;
      const box = pane.querySelector(".logbox"); box.scrollTop = box.scrollHeight;
    }
  };
  ov.addEventListener("mousedown", (e) => { if (e.target === ov) close(); });

    if (b.hasAttribute("data-close")) return close();
    if (b.dataset.tab) { SET.tab = b.dataset.tab; return draw(); }
    if (b.dataset.day) { SET.day = b.dataset.day; return draw(); }
    if (b.hasAttribute("data-purge")) {
      const lim = new Date(); lim.setDate(lim.getDate() - +SET.older); const cut = isoDay(lim);
      const old = logDays().filter((d) => d < cut);
      if (!old.length) return vd.message("Nema starijih dnevnika.");
      if (!(await vd.confirm(`Obrisati ${fmtNum(old.length)} ${old.length === 1 ? "dan" : "dana"} dnevnika?`, { ok: "Obriši", danger: true }))) return;
      old.forEach((d) => store.del(LOG_PREFIX + d)); log("INFO", `dnevnik: obrisano ${old.length} dana starijih od ${cut}`); return draw();
    }
    const sg = b.closest("[data-k]"); if (!sg) return;
    const k = sg.dataset.k, v = b.dataset.v;
    if (k === "theme") { document.documentElement.dataset.theme = v; store.set(APP + "_theme", v); log("INFO", `tema: ${v}`); if (S.mode === "hsw" && S.hsw.sub === "zid") renderPlan(); }
    if (k === "printer") { document.querySelector(`#printer [data-v="${v}"]`).click(); }
    if (k === "filter") SET.filter = v;
    if (k === "older") SET.older = v;
    draw();
  });
  document.addEventListener("keydown", onKey, true);
  document.body.classList.add("vd-lock"); document.body.appendChild(ov); draw();
}
$("#settings").addEventListener("click", openSettings);
// lokalna app (P4): Ugasi pored Podešavanja, uz potvrdu; V2/V3 ažuriranje
const LOCAL = ["127.0.0.1", "localhost"].includes(location.hostname);
let HEALTH = {};
if (LOCAL) {
  fetch("/health").then((r) => r.json()).then((h) => { HEALTH = h; }).catch(() => {});
  vv.init({ storeKey: "kosnica3d" }).then(() => vv.startChecks($("#vvBars")));
}
if (LOCAL) {
  const pw = $("#power"); pw.hidden = false;
  pw.addEventListener("click", async () => {
    if (!(await vd.confirm("Ugasiti Košnicu 3D?", { ok: "Ugasi", danger: true }))) return;
    log("INFO", "gašenje");
    try { await fetch("/api/shutdown", { method: "POST" }); } catch {}
  });
}

renderSide(); rebuild();
(function loop() { if (anim) anim(); placeCam(); renderer.render(scene, camera); requestAnimationFrame(loop); })();
</script>
